<dialog class="inquiry" id="inquiry" aria-labelledby="inquiry-title">
  <form class="inquiry-form" novalidate data-lang="ko">
    <button type="button" class="inquiry-close" data-inquiry-close aria-label="닫기">×</button>
    <p class="kicker">도입 상담</p>
    <h3 id="inquiry-title">상담 문의</h3>
    <p class="inquiry-lede">해결하고자 하는 과제와 현재 운영 중인 시스템을 알려주시면, 검토 후 회신드립니다.</p>
    <div class="inquiry-grid">
      <label><span>이름 <span class="req">*</span></span><input name="name" required maxlength="80" autocomplete="name"></label>
      <label><span>회사 / 소속</span><input name="company" maxlength="120" autocomplete="organization"></label>
      <label><span>이메일 <span class="req">*</span></span><input name="email" type="email" required maxlength="200" autocomplete="email"></label>
      <label><span>전화</span><input name="phone" type="tel" maxlength="40" autocomplete="tel"></label>
    </div>
    <label><span>문의 내용 <span class="req">*</span> <small class="hint">(최대한 상세하게 작성, 최소 200자)</small></span><textarea name="message" required minlength="200" maxlength="4000" rows="6" placeholder="해결하고자 하는 과제, 현재 사용 중인 시스템, 데이터 형태, 희망 일정과 예산 범위 등을 구체적으로 적어 주세요."></textarea><span class="inquiry-count" data-count-for="message"><b>0</b> / 200자</span></label>
    <label class="inquiry-hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
    <label class="inquiry-consent"><input type="checkbox" name="consent" required><span>문의 응대 목적으로만 연락처를 사용하는 데 동의합니다.</span></label>
    <p class="inquiry-status" role="status" aria-live="polite"></p>
    <div class="inquiry-actions">
      <button type="button" class="btn btn-plain" data-inquiry-close>취소</button>
      <button type="submit" class="btn btn-primary">보내기<span class="arrow">→</span></button>
    </div>
  </form>
  <div class="inquiry-done" hidden>
    <p class="kicker">접수 완료</p>
    <h3>문의가 접수되었습니다</h3>
    <p>남겨 주신 연락처로 검토 결과를 회신드리겠습니다.</p>
    <button type="button" class="btn btn-primary" data-inquiry-close>닫기</button>
  </div>
</dialog>
